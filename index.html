<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Memory From You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fef5f7 0%, #faf0f3 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .heart-icon {
            text-align: center;
            margin-bottom: 35px;
        }

        .heart-circle {
            width: 70px;
            height: 70px;
            background: #fce4ec;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 35px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.8em;
            color: #3a3a38;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        header p {
            font-size: 0.95em;
            color: #7a7a77;
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 0.4px;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #d4b5a9;
            margin: 30px auto;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #3a3a38;
            font-weight: 500;
            font-size: 0.92em;
            letter-spacing: 0.5px;
        }

        label span {
            color: #c97c7c;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e8dcd6;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            transition: all 0.4s ease;
            background: #fafaf9;
            color: #3a3a38;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #b8b0aa;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #c97c7c;
            background: white;
            box-shadow: 0 0 0 4px rgba(201, 124, 124, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
            line-height: 1.7;
        }

        .char-count {
            text-align: right;
            font-size: 0.8em;
            color: #b8b0aa;
            margin-top: 6px;
        }

        .button-group {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 0.98em;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #c97c7c 0%, #b86a6a 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(201, 124, 124, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #b86a6a 0%, #a85959 100%);
            box-shadow: 0 8px 28px rgba(201, 124, 124, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            color: #a09b96;
            font-size: 0.85em;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .footer-credit {
            text-align: center;
            color: #c8b5ad;
            font-size: 0.8em;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .status {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.95em;
            display: none;
            line-height: 1.8;
        }

        .status.error {
            background: #ffe8e8;
            color: #c97c7c;
            border: 1.5px solid #f0c8c8;
            display: block;
        }

        .thank-you-container {
            text-align: center;
        }

        .thank-you-heart {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .thank-you-message {
            color: #3a3a38;
            font-size: 1.1em;
            line-height: 1.9;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .thank-you-credit {
            color: #a09b96;
            font-size: 0.85em;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            header h1 {
                font-size: 2.2em;
                letter-spacing: 0.5px;
            }

            .heart-circle {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .btn-submit {
                padding: 14px;
                font-size: 0.92em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart-icon">
            <div class="heart-circle">💕</div>
        </div>

        <header>
            <h1>A Memory From You</h1>
            <p>Before life gets too busy, leave me a little piece of your memory — something I cherish forever.</p>
        </header>

        <div class="divider"></div>

        <form id="memoryForm">
            <div class="form-group">
                <label for="friendName">Your name <span>*</span></label>
                <input type="text" id="friendName" placeholder="What should I remember you as?" required>
            </div>

            <div class="form-group">
                <label for="nickname">What do you call me ? <span>*</span></label>
                <input type="text" id="nickname" placeholder="Your special name for me..." required>
            </div>

            <div class="form-group">
                <label for="memoryText">Write something about me <span>*</span></label>
                <textarea id="memoryText" placeholder="A memory, a funny moment, something you love about me, a wish for my future... anything you want me to remember." required></textarea>
                <div class="char-count"><span id="charCount">0</span> / 2000</div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Save This Memory 💕</button>
            </div>

            <div class="status" id="status"></div>
        </form>

        <div class="footer-text">Your words will be kept as a little memory for years to come.</div>
        <div class="footer-credit">Made with love - just for the memories</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIS6tpTEFUfYqgus5eUJWI3Iw87q5XCTCv_RSgWK4gIsTvTc5Lu5UatFMncxOmNhlqkQ/exec';

        const form = document.getElementById('memoryForm');
        const statusDiv = document.getElementById('status');
        const memoryText = document.getElementById('memoryText');
        const charCount = document.getElementById('charCount');

        memoryText.addEventListener('input', () => {
            charCount.textContent = memoryText.value.length;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const friendName = document.getElementById('friendName').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const memory = memoryText.value.trim();

            if (!friendName || !nickname || !memory) {
                showStatus('Please fill in all fields', 'error');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('friendName', friendName);
                formData.append('nickname', nickname);
                formData.append('memoryText', memory);
                formData.append('date', new Date().toLocaleString('en-IN', { 
                    day: 'numeric', 
                    month: 'short', 
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }));

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showThankYou();
                } else {
                    showStatus('Something went wrong. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Connection error. Please try again.', 'error');
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function showThankYou() {
            form.innerHTML = `
                <div class="thank-you-container">
                    <div class="thank-you-heart">💕</div>
                    <div class="thank-you-message">
                        Thank you for sharing this with me.<br>
                        Your memory means everything to me.
                    </div>
                    <div class="thank-you-credit">— Harsha</div>
                </div>
            `;
        }
    </script>
</body>
</html>
